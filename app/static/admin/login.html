<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syragent Platform | Đăng Nhập Quản Trị AI Agent SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body
  class="bg-gradient-to-br from-slate-900 via-slate-800 to-sky-950 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header Branding -->
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-600 to-cyan-400 shadow-xl shadow-sky-500/20 text-white mb-4">
        <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Syragent Platform</h1>
      <p class="text-slate-400 text-sm mt-1">Hệ thống Quản trị Đa Doanh nghiệp & Trợ lý AI</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/30 overflow-hidden">
      <!-- Tabs Selector -->
      <div class="flex border-b border-slate-200">
        <button id="tab-btn-login" type="button"
          class="flex-1 py-3.5 text-sm font-semibold text-sky-700 border-b-2 border-sky-600 bg-sky-50/50 transition-colors">
          Đăng Nhập
        </button>
        <button id="tab-btn-register" type="button"
          class="flex-1 py-3.5 text-sm font-semibold text-slate-500 hover:text-slate-700 transition-colors">
          Đăng Ký Doanh Nghiệp
        </button>
      </div>

      <div class="p-6 sm:p-8">
        <!-- 1. LOGIN FORM -->
        <form id="form-login" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Quản
              Trị</label>
            <input type="email" id="login-email" required placeholder="admin@congty.vn"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm outline-none transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Mật Khẩu</label>
            <input type="password" id="login-password" required placeholder="••••••••"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm outline-none transition-all">
          </div>

          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
              <input type="checkbox" id="remember-me" checked
                class="rounded border-slate-300 text-sky-600 focus:ring-sky-500">
              <span>Ghi nhớ đăng nhập</span>
            </label>
          </div>

          <button type="submit" id="login-submit-btn"
            class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-sky-600 to-cyan-600 hover:from-sky-700 hover:to-cyan-700 text-white font-semibold text-sm shadow-lg shadow-sky-600/30 transition-all flex items-center justify-center gap-2">
            <span>Vào Bảng Điều Khiển</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </form>

        <!-- 2. REGISTER FORM -->
        <form id="form-register" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Tên Doanh Nghiệp /
              Tổ Chức</label>
            <input type="text" id="reg-company-name" required minlength="2"
              placeholder="VD: Công ty TNHH Giải Pháp Công Nghệ"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm outline-none transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Quản
              Trị</label>
            <input type="email" id="reg-email" required placeholder="admin@company.com"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm outline-none transition-all">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Mật Khẩu</label>
              <input type="password" id="reg-password" required minlength="8" placeholder="Tối thiểu 8 ký tự"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm outline-none transition-all">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Xác Nhận</label>
              <input type="password" id="reg-password-confirm" required minlength="8" placeholder="Nhập lại mật khẩu"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm outline-none transition-all">
            </div>
          </div>

          <p class="text-[11px] text-slate-500">Mật khẩu cần có ít nhất 8 ký tự để bảo mật tối ưu.</p>

          <button type="submit" id="reg-submit-btn"
            class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-semibold text-sm shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
            <span>Tạo Tài Khoản Doanh Nghiệp</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>
        </form>
      </div>

      <!-- Footer Info -->
      <div class="px-6 py-3.5 bg-slate-50 border-t border-slate-200/80 text-center">
        <p class="text-xs text-slate-500">Bảo mật mã hóa đa tầng Fernet & Vector pgvector HNSW</p>
      </div>
    </div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script>
    // Tab switching logic
    const tabLogin = document.getElementById("tab-btn-login");
    const tabRegister = document.getElementById("tab-btn-register");
    const formLogin = document.getElementById("form-login");
    const formRegister = document.getElementById("form-register");

    tabLogin.addEventListener("click", () => {
      tabLogin.className = "flex-1 py-3.5 text-sm font-semibold text-sky-700 border-b-2 border-sky-600 bg-sky-50/50 transition-colors";
      tabRegister.className = "flex-1 py-3.5 text-sm font-semibold text-slate-500 hover:text-slate-700 transition-colors";
      formLogin.classList.remove("hidden");
      formRegister.classList.add("hidden");
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.className = "flex-1 py-3.5 text-sm font-semibold text-emerald-700 border-b-2 border-emerald-600 bg-emerald-50/50 transition-colors";
      tabLogin.className = "flex-1 py-3.5 text-sm font-semibold text-slate-500 hover:text-slate-700 transition-colors";
      formRegister.classList.remove("hidden");
      formLogin.classList.add("hidden");
    });

    // Handle Login submission
    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("login-submit-btn");

      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang xác thực...`;

      try {
        const tokenData = await apiRequest("/api/v1/auth/login", {
          method: "POST",
          json: { email, password },
        });

        // Fetch User Me info
        const me = await apiRequest("/api/v1/auth/me", {
          headers: { Authorization: `Bearer ${tokenData.access_token}` },
        });

        setAuthSession(tokenData.access_token, me);
        showToast(`Đăng nhập thành công! Đang chuyển hướng...`, "success");
        setTimeout(() => {
          window.location.href = "/admin";
        }, 600);
      } catch (err) {
        showToast(err.message || "Đăng nhập thất bại. Vui lòng kiểm tra lại tài khoản.", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Vào Bảng Điều Khiển</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
      }
    });

    // Handle Register submission
    formRegister.addEventListener("submit", async (e) => {
      e.preventDefault();
      const companyName = document.getElementById("reg-company-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      const confirm = document.getElementById("reg-password-confirm").value;
      const btn = document.getElementById("reg-submit-btn");

      if (password.length < 8) {
        showToast("Mật khẩu phải có ít nhất 8 ký tự!", "error");
        return;
      }

      if (password !== confirm) {
        showToast("Mật khẩu xác nhận không khớp!", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang tạo tài khoản...`;

      try {
        const tokenData = await apiRequest("/api/v1/auth/register", {
          method: "POST",
          json: {
            company_name: companyName,
            email: email,
            password: password,
          },
        });

        // Get user profile
        const me = await apiRequest("/api/v1/auth/me", {
          headers: { Authorization: `Bearer ${tokenData.access_token}` },
        });

        setAuthSession(tokenData.access_token, me);
        showToast("Đăng ký công ty thành công! Đang chuyển hướng...", "success");
        setTimeout(() => {
          window.location.href = "/admin";
        }, 600);
      } catch (err) {
        showToast(err.message || "Đăng ký thất bại. Email hoặc công ty có thể đã tồn tại.", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Tạo Tài Khoản Doanh Nghiệp</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
      }
    });

    // Check if already authenticated
    (async function checkExistingAuth() {
      const token = getToken();
      if (!token) return;
      try {
        const me = await apiRequest("/api/v1/auth/me");
        if (me && me.id) {
          window.location.href = "/admin";
        }
      } catch {
        // Token invalid, stay on login page
      }
    })();
  </script>
</body>

</html>
